<figure class="wm-wheel" data-downtime-wheel data-chosen="{{ wheel.chosen }}" data-final="{{ wheel.final_rotation }}">
  <svg viewBox="-110 -110 220 220" role="img" aria-label="Wheel for {{ result.action.name }}">
    <g class="wm-wheel-disc" style="transform: rotate({{ wheel.final_rotation }}deg)">
      {% for s in wheel.slices %}
      <path d="{{ s.path }}" fill="{{ s.colour }}" stroke="#fff" stroke-width="1"{% if forloop.counter0 == wheel.chosen %} data-chosen-slice{% endif %}/>
      <text x="{{ s.label_x }}" y="{{ s.label_y }}" transform="rotate({{ s.label_rotate }} {{ s.label_x }} {{ s.label_y }})" class="wm-wheel-label" text-anchor="middle" dominant-baseline="middle">{{ s.short }}</text>
      {% endfor %}
    </g>
    <polygon class="wm-wheel-pointer" points="-8,-110 8,-110 0,-92"/>
  </svg>
  <figcaption>
    <ul class="wm-wheel-legend list-unstyled">
      {% for s in wheel.slices %}
      <li><span class="wm-wheel-swatch" style="background: {{ s.colour }}"></span> {{ s.label }} <span class="text-muted">({{ s.percent|floatformat:1 }}%)</span></li>
      {% endfor %}
    </ul>
  </figcaption>
  {{ wheel|json_script:json_id }}
</figure>
