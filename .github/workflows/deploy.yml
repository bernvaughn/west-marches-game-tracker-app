name: deploy

# Deploys a release to the DigitalOcean Droplet.
# Publish a GitHub Release (for example v0.1.0) and this runs.
# You can also run it by hand from the Actions tab to redeploy or roll back to a tag.
#
# Needs these repository secrets:
#   DEPLOY_HOST         app.downtimemarket.com
#   DEPLOY_USER         deploy
#   DEPLOY_SSH_KEY      private key whose public half is in the deploy user's authorized_keys
#   DEPLOY_KNOWN_HOSTS  output of: ssh-keyscan -t ed25519 app.downtimemarket.com

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to deploy (for example v0.1.0). Use an older tag to roll back."
        required: true
        type: string

permissions:
  contents: read

# Never run two deploys at once, and never cancel one halfway.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  tests:
    name: tests
    # Skip pre-releases. Manual runs always go ahead.
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check the tag name
        run: |
          if ! [[ "$TAG" =~ ^v[0-9][0-9A-Za-z._-]*$ ]]; then
            echo "Tag '$TAG' is not a version tag like v0.1.0." >&2
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.TAG }}

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest -q

  deploy:
    name: deploy
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Run deploy script on the server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          test -f deploy/deploy.sh || { echo "deploy/deploy.sh is missing from $TAG." >&2; exit 1; }
          # The script travels over SSH on stdin, so the release always runs its own deploy logic.
          ssh -i ~/.ssh/deploy_key \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=20 \
              "$DEPLOY_USER@$DEPLOY_HOST" "bash -s -- $TAG" < deploy/deploy.sh

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
