<details open class="map-legend-details" aria-label="Map legend">
<summary class="map-legend-summary">
  <span>Legend</span>
  <svg class="map-legend-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 5l4 4 4-4z"/></svg>
</summary>
<ul class="map-legend">
  <li>
    <svg viewBox="-12 -12 24 24" aria-hidden="true"><polygon class="hex hex-visited" points="-10,0 -5,-9 5,-9 10,0 5,9 -5,9"/></svg>
    <span>Visited tile</span>
  </li>
  <li>
    <svg viewBox="-12 -12 24 24" aria-hidden="true"><polygon class="hex" points="-10,0 -5,-9 5,-9 10,0 5,9 -5,9"/></svg>
    <span>Unvisited tile</span>
  </li>
  <li>
    <svg viewBox="-12 -12 24 24" aria-hidden="true"><polygon class="hex hex-safe" points="-10,0 -5,-9 5,-9 10,0 5,9 -5,9"/></svg>
    <span>Safe town</span>
  </li>
  <li>
    <svg viewBox="-12 -12 24 24" aria-hidden="true"><polygon class="hex" points="-10,0 -5,-9 5,-9 10,0 5,9 -5,9"/><text class="legend-unexplored" x="0" y="0" text-anchor="middle" dominant-baseline="central">!</text></svg>
    <span>Unexplored</span>
  </li>
  <li>
    <svg viewBox="-12 -12 24 24" aria-hidden="true"><polygon class="hex" points="-10,0 -5,-9 5,-9 10,0 5,9 -5,9"/><text class="legend-unknown" x="0" y="0" text-anchor="middle" dominant-baseline="central">?</text></svg>
    <span>Hidden location (placeholder "?")</span>
  </li>
  <li>
    <svg viewBox="-12 -12 24 24" aria-hidden="true"><polygon class="hex" points="-10,0 -5,-9 5,-9 10,0 5,9 -5,9"/><circle class="hex-badge" cx="0" cy="0" r="6"/><text class="hex-badge-text" x="0" y="0" text-anchor="middle" dominant-baseline="central">2</text></svg>
    <span>Credit badge (count on tile)</span>
  </li>
  <li>
    <svg viewBox="-12 -12 24 24" aria-hidden="true"><polygon class="hex" style="fill: var(--wm-info-bg)" points="-10,0 -5,-9 5,-9 10,0 5,9 -5,9"/></svg>
    <span>Known location (uses its colour)</span>
  </li>
</ul>
</details>
