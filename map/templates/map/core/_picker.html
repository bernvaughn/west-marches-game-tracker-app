<div class="map-picker">
{% if is_editor %}
<p class="view-switch"><a href="{{ full_url }}">Full map</a> | <a href="{{ players_url }}">Players' view</a>{% if players_view %} (showing){% else %} (full map showing){% endif %}</p>
{% endif %}
{% if players_view %}
<form method="get">
{% if hex_map and radius %}<input type="hidden" name="q" value="{{ q }}"><input type="hidden" name="r" value="{{ r }}"><input type="hidden" name="radius" value="{{ radius }}">{% endif %}
{% if is_editor %}<input type="hidden" name="view" value="players">{% endif %}
{% for c in choices %}<label><input type="checkbox" name="characters" value="{{ c.pk }}"{% if c.pk in picked_ids %} checked{% endif %}> {{ c.name }}</label> {% endfor %}
<button type="submit">Show</button>
</form>
{% endif %}
</div>
