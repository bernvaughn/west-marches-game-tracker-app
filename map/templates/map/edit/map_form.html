{% extends "base.html" %}
{% load static %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<link rel="stylesheet" href="{% static 'map/map.css' %}">
<h1>{{ title }}</h1>
<form method="post">
{% csrf_token %}
{{ form.as_p }}
<button class="btn btn-sm btn-primary" type="submit">Save</button>
<a href="{% if back %}{{ back }}{% else %}{% url 'map:index' club.slug %}{% endif %}">Cancel</a>
</form>
{% endblock %}
