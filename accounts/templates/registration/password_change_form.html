{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<h1>Change password</h1>
{% if user.must_change_password %}<p class="notice">Choose a new password before you continue.</p>{% endif %}
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Change password</button>
</form>
{% endblock %}
