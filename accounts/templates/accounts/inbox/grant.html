{% extends "base.html" %}
{% block title %}Grant for message #{{ msg.pk }}{% endblock %}
{% block content %}
<h1>Grant for message #{{ msg.pk }}</h1>
<blockquote class="blockquote">{{ msg.body|linebreaksbr }}</blockquote>
<form method="post" action="{% url 'accounts:message_grant' request.club.slug msg.pk %}">
  {% include "accounts/inbox/_grant_fields.html" %}
  <button class="btn btn-primary" type="submit">Grant</button>
  <a href="{% url 'accounts:message_inbox' request.club.slug %}?status={{ filter }}">Back to inbox</a>
</form>
{% endblock %}
