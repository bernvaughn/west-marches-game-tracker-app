{% url 'accounts:message_grant' request.club.slug msg.pk as grant_url %}
<form method="post" action="{{ grant_url }}" hx-post="{{ grant_url }}" hx-target="#app-modal .modal-content">
  <div class="modal-header">
    <h1 class="modal-title fs-5">Grant for message #{{ msg.pk }}</h1>
    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
  </div>
  <div class="modal-body">
    <p class="text-muted small">{{ msg.body|truncatechars:200 }}</p>
    {% include "accounts/inbox/_grant_fields.html" %}
  </div>
  <div class="modal-footer">
    <button class="btn btn-primary" type="submit">Grant</button>
  </div>
</form>
