{% extends "components/modal_frame.html" %}
{% block content %}
<form method="post" hx-post="{{ request.path }}" hx-target="#app-modal .modal-content">
  {{ block.super }}
</form>
{% endblock %}
{% block title %}Roles for {{ who }}{% endblock %}
{% block body %}{% include "accounts/people/_roles_body.html" %}{% endblock %}
{% block footer %}
<button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
<button class="btn btn-primary" type="submit">Save</button>
{% endblock %}
