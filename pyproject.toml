[project]
name = "west-marches-game-tracker"
version = "0.1.0"
description = "West Marches game tracker"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.2,<5.3",
    "mcp>=2.3,<3",
    "djangorestframework>=3.15",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-django",
    "ruff",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
markers = ["story(id): user story id"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
