[project]
name = "west-marches-game-tracker"
version = "0.1.0"
description = "Downtime Market: a game tracker for West Marches style campaigns"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.2,<5.3",
    "mcp>=2.3,<3",
    "djangorestframework>=3.15",
    "django-oauth-toolkit>=3.4,<4",
]

[dependency-groups]
dev = [
    "playwright>=1.65.1",
    "pytest",
    "pytest-django",
    "ruff",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
markers = ["story(id): user story id", "browser: needs Chromium; run with -m browser"]
addopts = "--strict-markers -m \"not browser\""

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
