{% comment %}toast_container: Toast notification container. Requires Alpine.js and static/js/toast.js.
   Place once in base.html, outside main, so toasts persist across HTMX swaps.
{% endcomment %}
<div x-data="wmToast" x-init="init()" class="wm-toast-container no-print" aria-live="polite" aria-atomic="true">
  <template x-for="toast in toasts" :key="toast.id">
    <div class="wm-toast wm-toast-{{ toast.type }}" x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0 transform translate-y-2" x-transition:enter-end="opacity-100" x-transition:leave="transition ease-in duration-200" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0 transform translate-y-2">
      <div class="wm-toast-icon" x-html="toastIcon(toast.type)"></div>
      <div class="wm-toast-message" x-text="toast.message"></div>
      <button type="button" class="wm-toast-close" @click="remove(toast.id)" aria-label="Dismiss">
        {% include "components/icon.html" with name="x-lg" %}
      </button>
    </div>
  </template>
</div>

<script>
if (typeof Alpine !== 'undefined') {
  Alpine.data('wmToast', function () {
    return {
      toasts: [],
      init() {
        this.$watch('toasts', (val) => {
          if (val.length > 0) {
            this.$nextTick(() => {
              const el = this.$refs.container;
              if (el) el.scrollTop = el.scrollHeight;
            });
          }
        });
      },
      toastIcon(type) {
        const icons = {
          success: '<svg class="wm-icon" fill="currentColor" viewBox="0 0 16 16"><path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z"/></svg>',
          warning: '<svg class="wm-icon" fill="currentColor" viewBox="0 0 16 16"><path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm1-13a1 1 0 1 0-2 0 1 1 0 0 0 2 0zM7 11V7a1 1 0 0 1 2 0v4a1 1 0 0 1-2 0z"/></svg>',
          danger: '<svg class="wm-icon" fill="currentColor" viewBox="0 0 16 16"><path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zM5.354 4.646a.5.5 0 1 0-.708.708L7.293 8l-2.647 2.646a.5.5 0 0 0 .708.708L8 8.707l2.646 2.647a.5.5 0 0 0 .708-.708L8.707 8l2.647-2.646a.5.5 0 0 0-.708-.708L8 7.293 5.354 4.646z"/></svg>',
          info: '<svg class="wm-icon" fill="currentColor" viewBox="0 0 16 16"><path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/><path d="m8.93 6.588-2.29.287-.082.38.45.083c.294.07.352.176.288.469l-.738 3.468c-.194.916.781.916.977 0l.738-3.468c.083-.293.024-.399-.288-.469l-.45-.083-.082-.38-2.29-.287a1 1 0 0 1-.917-1.994A1 1 0 0 1 8 6c.53 0 1 .045 1 .131l.001.097 1.929 1.36a1 1 0 0 1-.836 1.812z"/></svg>'
        };
        return icons[type] || icons.info;
      },
      add(message, type = 'info', timeout = 5000) {
        const id = Date.now() + Math.random();
        this.toasts.push({ id, message, type });
        if (timeout > 0) {
          setTimeout(() => this.remove(id), timeout);
        }
      },
      remove(id) {
        const idx = this.toasts.findIndex((t) => t.id === id);
        if (idx > -1) this.toasts.splice(idx, 1);
      },
    };
  });
}

// Listen for HTMX toast triggers
document.body.addEventListener('htmx:afterSwap', function (evt) {
  if (evt.detail.xhr) {
    const trigger = evt.detail.xhr.getResponseHeader('HX-Trigger');
    if (trigger) {
      try {
        const data = JSON.parse(trigger);
        if (data.toast) {
          const toastEl = document.querySelector('[x-data*="wmToast"]');
          if (toastEl && toastEl._x_dataStack) {
            const toastData = toastEl._x_dataStack[0];
            if (typeof data.toast === 'string') {
              toastData.add(data.toast, 'info');
            } else if (data.toast.message) {
              toastData.add(data.toast.message, data.toast.type || 'info', data.toast.timeout);
            }
          }
        }
      } catch (e) {
        // Not JSON, ignore
      }
    }
  }
});
</script>
