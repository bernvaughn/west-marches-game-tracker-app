{% if field.widget_type == "checkbox" %}<div class="form-check mb-2">{{ field }}<label class="form-check-label" for="{{ field.id_for_label }}">{{ field.label }}</label>{% if field.help_text %}<div class="form-text">{{ field.help_text|safe }}</div>{% endif %}{{ field.errors }}</div>{% else %}<div class="mb-2">{% if field.label %}<label class="form-label mb-0" for="{{ field.id_for_label }}">{{ field.label }}</label>{% endif %}{{ field }}{% if field.help_text %}<div class="form-text">{{ field.help_text|safe }}</div>{% endif %}{{ field.errors }}</div>{% endif %}
