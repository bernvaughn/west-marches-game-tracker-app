{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="card col-sm-8 col-md-5 mx-auto mt-4">
  <div class="card-body">
    <h1 class="h4 card-title">Log in</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="btn btn-primary btn-sm w-100">Log in</button>
    </form>
  </div>
</div>
{% endblock %}
