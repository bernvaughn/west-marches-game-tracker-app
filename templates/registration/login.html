{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block main_class %}wm-main--narrow{% endblock %}
{% block content %}
<div class="wm-auth-card">
  <p class="wm-auth-brand">West Marches</p>
  <h1>Log in</h1>
  <p class="wm-page-subtitle">Sign in to see your clubs and characters.</p>
  <form method="post" class="wm-form">
    {% csrf_token %}
    {{ form }}
    <input type="hidden" name="next" value="{{ next }}">
    <div class="wm-form-actions"><button type="submit" class="btn btn-primary w-100">Log in</button></div>
  </form>
</div>
{% endblock %}
