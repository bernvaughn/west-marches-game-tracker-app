{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="card col-sm-8 col-md-5 mx-auto mt-4">
  <div class="card-body">
    <h1 class="h4 card-title">Change password</h1>
    {% if user.must_change_password %}<p class="notice alert alert-info py-1 px-2">Choose a new password before you continue.</p>{% endif %}
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary btn-sm w-100">Change password</button>
    </form>
  </div>
</div>
{% endblock %}
