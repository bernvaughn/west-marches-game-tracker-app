<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ subject|default:"Email from Downtime Market" }}</title>
    <style>
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; padding: 20px; }
      .container { background: #fff; border: 1px solid #e1e4e8; border-radius: 6px; padding: 32px; }
      .header { margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid #e1e4e8; }
      .header h1 { margin: 0; font-size: 24px; font-weight: 600; color: #24292e; }
      .content { margin-bottom: 24px; }
      .content p { margin: 0 0 16px; }
      .extra { margin-top: 24px; padding-top: 16px; border-top: 1px solid #e1e4e8; }
      .footer { margin-top: 32px; padding-top: 16px; border-top: 1px solid #e1e4e8; font-size: 13px; color: #586069; }
      .footer p { margin: 0 0 8px; }
      .button { display: inline-block; padding: 10px 20px; background: #0366d6; color: #fff; text-decoration: none; border-radius: 6px; font-weight: 500; }
      .button:hover { background: #0256b9; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        {% if club %}
          <h1>{{ club.name }}</h1>
        {% else %}
          <h1>Downtime Market</h1>
        {% endif %}
      </div>
      <div class="content">
        {{ content|safe }}
      </div>
      {% if extra_html %}
      <div class="extra">
        {{ extra_html|safe }}
      </div>
      {% endif %}
      <div class="footer">
        {% for line in footer_lines %}
          <p>{{ line }}</p>
        {% endfor %}
      </div>
    </div>
  </body>
</html>
