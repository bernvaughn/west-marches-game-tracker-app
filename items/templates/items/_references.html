{% load coins %}
{% if items %}
<table class="table table-sm">
  <thead><tr><th>Item</th><th>Band</th><th>Price</th></tr></thead>
  <tbody>
  {% for item in items %}
    <tr><td>{% include "items/_item_name.html" %}</td><td>{{ item.get_rarity_display|default:"—" }}</td><td>{{ item.value_cp|coins }}</td></tr>
  {% endfor %}
  </tbody>
</table>
{% else %}
<p class="text-muted small">Choose a band or enter a value to see similar items, or search by name.</p>
{% endif %}
