{% extends "base.html" %}
{% block content %}
<h1>Buy from {{ shop.name }}</h1>
<form method="post">
  {% csrf_token %}
  {% include "shops/buy/_confirm_body.html" %}
  {% if character and not sold_out %}<button class="btn btn-sm btn-primary" type="submit">Buy as {{ character.name }}</button>{% endif %}
</form>
<p><a href="{% url 'shops:detail' request.club.slug shop.pk %}">Back to {{ shop.name }}</a></p>
{% endblock %}
