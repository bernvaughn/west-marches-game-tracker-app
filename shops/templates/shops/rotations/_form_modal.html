{% extends "components/modal_frame.html" %}
{% block content %}
<form method="post" action="{{ request.get_full_path }}" hx-post="{{ request.get_full_path }}" hx-target="#app-modal .modal-content">
  {% csrf_token %}
  {{ block.super }}
</form>
{% endblock %}
{% block title %}{% if rotation %}Edit rotation{% else %}New rotation{% endif %}{% endblock %}
{% block body %}{{ form }}{% endblock %}
{% block footer %}
<button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
<button class="btn btn-primary" type="submit">Save</button>
{% endblock %}
