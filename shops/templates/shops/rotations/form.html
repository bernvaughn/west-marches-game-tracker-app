{% extends "base.html" %}
{% block content %}
<h1>{% if rotation %}Edit rotation{% else %}New rotation{% endif %}</h1>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button class="btn btn-sm btn-primary" type="submit">Save</button>
  <a href="{% url 'shops:rotation_list' club.slug %}">Cancel</a>
</form>
{% if rotation %}
<form method="post" action="{% url 'shops:rotation_delete' club.slug rotation.id %}">
  {% csrf_token %}<button class="btn btn-sm btn-outline-danger" type="submit">Delete rotation</button>
</form>
{% endif %}
{% endblock %}
