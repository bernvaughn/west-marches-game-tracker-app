{% extends "base.html" %}
{% block content %}
<h1>Manage shops</h1>
<p><a href="{% url 'shops:manage_create' club.slug %}">New shop</a></p>
<div class="table-responsive"><table class="table table-sm table-striped align-middle">
<tr><th>Name</th><th>Symbol</th><th>Status</th><th>Stock</th></tr>
{% for shop, is_open in rows %}
<tr>
<td><a href="{% url 'shops:manage_edit' club.slug shop.pk %}">{{ shop.name }}</a></td>
<td>{{ shop.symbol }}</td>
<td>{% if is_open %}Open{% else %}Closed{% endif %}</td>
<td>{{ shop.stock_count }}</td>
</tr>
{% empty %}
<tr><td colspan="4">No shops yet.</td></tr>
{% endfor %}
</table></div>
{% endblock %}
