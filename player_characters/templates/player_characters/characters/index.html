{% extends "base.html" %}
{% block title %}Characters{% endblock %}
{% block content %}
<h1>Characters</h1>
<p><a href="{% url 'characters:create' club.slug %}">New character</a></p>
<ul>
{% for c in characters %}
  <li><a href="{% url 'characters:detail' club.slug c.pk %}">{{ c.name }}</a> — {{ c.owner.user.display_name }}</li>
{% empty %}
  <li>No characters yet.</li>
{% endfor %}
</ul>
{% endblock %}
