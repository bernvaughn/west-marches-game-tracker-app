<article class="wm-slip">
  <h2>{{ slip.name }}</h2>
  <p class="wm-slip-player">{{ slip.player }}</p>
  <ul>
    <li>Pronouns: {{ slip.pronouns }}</li>
    <li>Passive Perception: {{ slip.passive }}</li>
    <li>Level: {{ slip.level }}</li>
    <li>Class: {{ slip.char_class }}</li>
    <li>Species: {{ slip.species }}</li>
  </ul>
</article>
