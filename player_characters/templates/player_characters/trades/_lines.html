{% load coins %}
{% if lines %}
<ul class="wm-trade-lines">
{% for line in lines %}
  <li>{% if line.item %}{% include "items/_item_name.html" with item=line.item %} &times; {{ line.quantity }}{% else %}{{ line.coins|coins }}{% endif %}</li>
{% endfor %}
</ul>
{% else %}
<p class="text-body-secondary mb-0">Nothing yet.</p>
{% endif %}
