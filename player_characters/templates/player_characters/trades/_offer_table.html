{% if rows %}
<div class="wm-table-scroll"><table class="table table-sm wm-data-table wm-sheet-table">
  <thead><tr><th>Item</th><th class="num">Owned</th><th class="num">Available</th><th class="num">{{ column }}</th></tr></thead>
  <tbody>
  {% for r, field in rows %}
  <tr{% if not field %} class="wm-trade-row-unavailable"{% endif %}>
    <td>{% include "items/_item_name.html" with item=r.item %}</td>
    <td class="num">{{ r.owned }}</td>
    <td class="num">{{ r.available }}</td>
    <td class="num">
      {% if field %}
      <label class="visually-hidden" for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field }}
      {{ field.errors }}
      {% else %}
      <input type="number" class="form-control form-control-sm" value="0" disabled aria-label="{{ column }} {{ r.item.name }} (none available)">
      {% endif %}
    </td>
  </tr>
  {% endfor %}
  </tbody>
</table></div>
{% else %}
<p class="wm-sheet-note">No items.</p>
{% endif %}
